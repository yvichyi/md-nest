name: Build VinylField APK
on:
  push:
    branches: [vinylfield-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract VinylField source
        run: unzip -q -o VinylField-source.zip -d .
      - name: Install VinylField launcher art
        run: |
          mkdir -p app/src/main/res/drawable
          cp build-res/vf_launcher.xml app/src/main/res/drawable/vf_launcher.xml
          sed -i 's|android:label="VINYL FIELD"|android:label="VINYL FIELD" android:icon="@drawable/vf_launcher" android:roundIcon="@drawable/vf_launcher"|' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/vf_launcher"' app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Live upstream smoke check (diagnostic only)
        continue-on-error: true
        run: node tests/smoke_public_api.mjs
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VinylField-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
