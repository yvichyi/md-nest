name: Render UI layout proof
on:
  push:
    branches: [vinylfield-qq-landscape-redesign]
    paths:
      - '.github/workflows/render-ui-proof.yml'
      - 'android-source/app/src/main/assets/qq-landscape.css'
      - 'android-source/app/src/main/assets/mobile-cai-jiao.css'
      - 'android-source/app/src/main/assets/mobile-cai-jiao.js'
      - 'android-source/app/src/main/assets/index.html'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chinese UI fonts for visual validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Prepare non-network sample player state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('android-source/app/src/main/assets/index.html')
          html=src.read_text()
          demo=r"""
          <script>
          window.addEventListener('load',function(){
            setTimeout(function(){
              var svg='<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720"><defs><linearGradient id="bg" x1="0" y1="0" x2=".95" y2="1"><stop stop-color="#2c171b"/><stop offset=".49" stop-color="#65302d"/><stop offset="1" stop-color="#100f1b"/></linearGradient><radialGradient id="glow"><stop stop-color="#e9a86d" stop-opacity=".87"/><stop offset="1" stop-color="#e9a86d" stop-opacity="0"/></radialGradient><linearGradient id="skin" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f2c5a0"/><stop offset=".56" stop-color="#aa5c44"/><stop offset="1" stop-color="#492326"/></linearGradient><linearGradient id="shadow" x1="0" x2="1"><stop stop-color="#150f17"/><stop offset="1" stop-color="#51303b"/></linearGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".11"/></feComponentTransfer></filter></defs><rect width="720" height="720" fill="url(#bg)"/><circle cx="513" cy="280" r="330" fill="url(#glow)"/><path d="M160 720Q173 473 392 474Q555 469 618 720Z" fill="url(#shadow)"/><path d="M321 440Q268 350 290 218Q315 93 439 116Q559 129 548 306Q542 410 479 459Q445 502 394 488Z" fill="url(#skin)"/><path d="M269 297Q231 115 399 76Q562 44 589 202Q603 306 562 396Q545 274 533 227Q484 215 463 172Q410 269 304 245Z" fill="#160e16"/><path d="M274 281Q226 330 245 487Q252 591 199 673Q354 657 390 488Q311 468 274 281Z" fill="#20121a"/><path d="M524 202Q582 280 579 404Q578 536 653 660Q534 612 491 463Q548 358 524 202Z" fill="#24111a"/><path d="M342 301Q367 283 396 304M451 295Q480 283 505 296" stroke="#3c2324" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M403 371Q440 382 469 364" stroke="#81483a" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M405 412Q449 433 485 405" stroke="#6c302e" stroke-width="7" fill="none"/><rect width="720" height="720" filter="url(#grain)" opacity=".32"/><text x="43" y="77" font-size="29" fill="#fff1df" letter-spacing="13" font-family="serif">AFTERGLOW</text><text x="47" y="112" font-size="12" fill="#e2b398" letter-spacing="6" font-family="sans-serif">MIDNIGHT SESSIONS</text><path d="M45 622H205" stroke="#e4b391" stroke-width="1" opacity=".68"/><text x="44" y="664" font-size="20" fill="#eddac6" font-family="Georgia" letter-spacing="5">SIDE A · 07</text></svg>';
              var url='data:image/svg+xml,'+encodeURIComponent(svg);
              var pic=document.getElementById('recordCover');
              pic.src=url;pic.hidden=false;
              document.getElementById('recordMonogram').hidden=true;
              document.getElementById('ambientCover').style.backgroundImage='url("'+url+'")';
              document.getElementById('songTitle').textContent='留在暮色里 · Afterglow';
              document.getElementById('songArtist').textContent='Midnight Sessions';
              var root=document.documentElement.style;
              root.transition='none';
              document.getElementById('toast').style.display='none';
              var colors={'--cv-paper':'#fff0e4','--cv-paper-light':'#fff8f1','--cv-paper-deep':'#f0d9c8','--cv-disc':'#f7b17e','--cv-disc-light':'#ffd9b3','--cv-disc-deep':'#da885c','--cv-ink':'#251d1b','--cv-muted':'#887971','--cv-accent':'#eea25e','--cv-accent-dark':'#c57b45'};
              Object.keys(colors).forEach(function(k){root.setProperty(k,colors[k]);});
              var lines=['月光在窗边慢慢退去','我们听见夜色的呼吸','就在你身旁，一切变得温柔','时间开始向远处流淌','明天醒来，也仍有光'];
              document.getElementById('lyricLines').innerHTML=lines.map(function(t,i){return '<p class="lyric-line'+(i===2?' active':'')+'"'+(i===2?' style="--line-fill:38%"':'')+'>'+t+'</p>';}).join('');
              document.getElementById('currentTime').textContent='01:24';
              document.getElementById('totalTime').textContent='03:48';
              document.getElementById('seekSlider').value='368';
              document.getElementById('seekSlider').style.setProperty('--progress','36.8%');
              document.body.classList.add('is-playing');
            },50);
          });
          </script>
          """
          html=html.replace('</body>',demo+'</body>')
          Path('android-source/app/src/main/assets/test-preview.html').write_text(html)
          PY
      - name: Render 16:9 landscape, compact landscape and portrait
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p design-qa
          URL="file://$(pwd)/android-source/app/src/main/assets/test-preview.html"
          for row in "915,412,phone-landscape-915x412" "844,390,phone-landscape-844x390" "740,360,compact-landscape-740x360" "430,932,portrait-rotate-hint"; do
            IFS=, read -r W H NAME <<< "$row"
            timeout 45 "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=1600 --window-size="$W,$H" --screenshot="design-qa/$NAME.png" "$URL"
            test -s "design-qa/$NAME.png"
          done
          file design-qa/*.png
      - name: Commit visual proofs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add design-qa
          git commit -m "test(ui): render landscape and portrait screenshots" || exit 0
          git fetch origin vinylfield-qq-landscape-redesign
          git rebase origin/vinylfield-qq-landscape-redesign
          git push
