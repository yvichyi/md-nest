name: Build VinylField QQ Landscape APK
on:
  push:
    branches: [vinylfield-qq-landscape-redesign]
    paths:
      - 'android-source/**'
      - '.github/workflows/build-redesign-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          [ -n "$SDKMANAGER" ] || exit 1
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble debug APK
        working-directory: android-source
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Sanity check sources and layout
        working-directory: android-source
        run: |
          node --check app/src/main/assets/app.js
          grep -q 'qq-landscape.css' app/src/main/assets/index.html
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Live upstream smoke check (diagnostic only)
        working-directory: android-source
        continue-on-error: true
        run: node tests/smoke_public_api.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VinylField-QQ-landscape-debug
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
